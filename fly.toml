# To deploy your own copy, change `app` and the URL below to a unique name.
app = "oberon"
primary_region = "iad"

[env]
  OBERON_PUBLIC_URL = "https://oberon.fly.dev"

# Exactly one Machine, always running: the `amp top` watcher must stay up to
# deliver events, and OAuth + subscription state lives on one volume.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[mounts]
  source = "oberon_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
